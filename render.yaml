services:
  # 1. Frontend - Static Single-Page Application
  - type: static
    name: feedback-analyzer-frontend
    env: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://feedback-analyzer-api.onrender.com/api/v1

  # 2. Backend - Express API Gateway & Aggregation Service
  - type: web
    name: feedback-analyzer-api
    env: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: node backend/src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-analyzer-db
          property: connectionString
      - key: NLP_SERVICE_URL
        value: http://feedback-analyzer-nlp:8000
      - key: NLP_TIMEOUT_MS
        value: 2000
      - key: FRONTEND_URL
        value: https://feedback-analyzer-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # 3. NLP Analytical Subsystem - Isolated In-Memory Microservice
  # Bound strictly to Render private internal network (no public IP / internet access)
  - type: pserv
    name: feedback-analyzer-nlp
    env: python
    plan: free
    buildCommand: pip install -r nlp/requirements-prod.txt
    startCommand: uvicorn nlp.src.service:app --host 0.0.0.0 --port 8000
    envVars:
      - key: NLP_HOST
        value: 0.0.0.0
      - key: NLP_PORT
        value: 8000
      - key: NLP_ARTIFACT_DIR
        value: nlp/artifacts/v1.0.0

# 4. Relational Database - PostgreSQL 16
databases:
  - name: feedback-analyzer-db
    databaseName: feedback_analyzer
    user: feedback_user
    plan: free
    postgresMajorVersion: 16
